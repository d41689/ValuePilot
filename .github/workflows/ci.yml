name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEV_HOST_WEB_PORT: 13001
      DEV_HOST_API_PORT: 18001

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Create shared Docker network
        run: docker network create projects-shared || true

      # Dev connects to the shared Postgres (~/projects/infra) at host
      # `postgres:5432`. CI has no such instance, so stand one up on the shared
      # network with the same db/role the app expects.
      - name: Start shared Postgres (CI stand-in for ~/projects/infra)
        run: |
          docker run -d --name shared-postgres \
            --network projects-shared --network-alias postgres \
            -e POSTGRES_USER=valuepilot -e POSTGRES_PASSWORD=valuepilot -e POSTGRES_DB=valuepilot \
            --health-cmd "pg_isready -U valuepilot -d valuepilot" \
            --health-interval 5s --health-timeout 5s --health-retries 20 \
            postgres:18
          echo "Waiting for shared-postgres to be healthy..."
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' shared-postgres 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && { echo "healthy"; break; }
            sleep 2
          done

      - name: Create CI env file
        run: |
          cat > .env <<'EOF'
          NEXT_PUBLIC_API_URL=/api/v1
          SECRET_KEY=valuepilot-ci-secret-key
          RATE_GUARD_URL=http://rate-guard.invalid
          EDGAR_FETCH_MODE=replay
          EOF

      - name: Build and start services
        run: docker compose up -d --build

      - name: Apply migrations
        run: docker compose exec -T api alembic upgrade head

      - name: Run backend tests
        run: docker compose exec -T api pytest -q

      - name: Run frontend unit tests
        run: docker compose exec -T web sh -lc 'node --test lib/*.test.js'

      - name: Run frontend lint
        run: docker compose exec -T web npm run lint

      - name: Run frontend production build
        run: docker compose exec -T web sh -lc 'NODE_ENV=production npm run build'

      - name: Run Rate Guard tests
        run: |
          cd rate-guard
          pip install -r requirements-dev.txt
          pytest -q

      - name: Verify singleton Rate Guard topology
        run: ./scripts/check_rate_guard_topology.sh

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down services
        if: always()
        run: |
          docker compose down -v
          docker rm -f shared-postgres || true
