name: valuepilot-prod

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
      - .env.prod
    ports:
      - "${HOST_WEB_PORT:-3101}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    networks:
      - default
    depends_on:
      api:
        condition: service_started
    command: >
      sh -c "npm run build &&
             mkdir -p .next/standalone/.next &&
             rm -rf .next/standalone/.next/static &&
             cp -R .next/static .next/standalone/.next/static &&
             if [ -d public ]; then
               rm -rf .next/standalone/public &&
               cp -R public .next/standalone/public;
             fi &&
             cd .next/standalone &&
             HOSTNAME=0.0.0.0 PORT=3000 node server.js"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
      - .env.prod
    ports:
      - "${HOST_API_PORT:-8101}:8000"
    environment:
      DATABASE_URL: postgresql://${VALUEPILOT_DB_USER:-valuepilot}:${VALUEPILOT_DB_PASSWORD:-valuepilot}@postgres:5432/${VALUEPILOT_PROD_DB:-valuepilot_prod}
      # Production stays on the private Docker hop. deploy_prod_from_main.sh
      # proves the public development ingress exposes this same instance, then
      # exports the identity used here before Compose evaluates the file.
      RATE_GUARD_URL: http://rate-guard:9000
      RATE_GUARD_API_KEY: "${RATE_GUARD_API_KEY:-deploy-not-configured}"
      RATE_GUARD_EXPECTED_INSTANCE_ID: "${RATE_GUARD_EXPECTED_INSTANCE_ID:-deploy-not-verified}"
    volumes:
      - ./docs:/code/docs:ro
      - ${VALUEPILOT_UPLOADS_DIR:-./storage/uploads}:/code/storage/uploads
      - ${VALUEPILOT_EDGAR_RAW_DIR:-./storage/edgar_raw}:/code/storage/edgar_raw
    # Explicit shutdown budget for the graceful path below: uvicorn drains
    # connections, then FastAPI lifespan runs scheduler.shutdown() +
    # job_worker.stop(timeout=5s). 15s leaves margin over Docker's 10s default.
    stop_grace_period: 15s
    # `exec` so uvicorn replaces the shell as PID 1 and receives SIGTERM
    # directly on `docker stop` / deploy recreation. Without it the shell is
    # PID 1 and never forwards the signal, so uvicorn is SIGKILL'd after the
    # grace period — skipping FastAPI's lifespan shutdown, so the 13F worker
    # never records status='stopped' and leaks a stale heartbeat row.
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - default
      - shared-infra

networks:
  shared-infra:
    external: true
    name: projects-shared
