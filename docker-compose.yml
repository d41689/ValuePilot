name: valuepilot-dev

services:
  # Placeholder only. The real Postgres is the shared instance on the
  # projects-shared network (~/projects/infra); dev connects to it as
  # `postgres:5432/valuepilot`. Kept as a no-op so tooling referencing the
  # `db` service still resolves. (Old local data survives in ./storage/postgres.)
  db:
    image: postgres:18
    restart: unless-stopped
    command: ["sleep", "infinity"]
    environment:
      PGHOST: postgres
      PGUSER: valuepilot
      PGPASSWORD: valuepilot
      PGDATABASE: valuepilot
    networks:
      - shared-infra

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # Dev-only host ports — distinct var names from prod's HOST_WEB_PORT /
    # HOST_API_PORT (docker-compose.prod.yml). A shared .env sets those to the
    # prod values 3101/8101; using DEV_* here keeps that from bleeding into the
    # dev stack, so dev (3001/8001) and prod (3101/8101) run side by side.
    ports:
      - "${DEV_HOST_WEB_PORT:-3001}:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next-dev
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    depends_on:
      api:
        condition: service_started

  # Development-only emergency egress. It is never published to the host or
  # attached to shared-infra, and the API selects it only after the central
  # authenticated identity origin is genuinely unavailable. Its 1 req/s SEC
  # budget keeps worst-case central (8) + fallback (1) below SEC's ceiling.
  rate-guard-local:
    build:
      context: ./rate-guard
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RATE_GUARD_CACHE_DIR: /data/cache
      RATE_GUARD_EDGAR_RPS: "1.0"
    volumes:
      - rate_guard_fallback_cache:/data/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DEV_HOST_API_PORT:-8001}:8000"
    environment:
      DATABASE_URL: postgresql://valuepilot:valuepilot@postgres:5432/valuepilot
      # Every development stack, including one on the production host, enters
      # through the authenticated public route. The deploy gate proves this URL
      # terminates at production's one internal Rate Guard process.
      RATE_GUARD_URL: https://rate-guard.richmom.vip
      RATE_GUARD_ALLOW_LOCAL_FALLBACK: "true"
      RATE_GUARD_FALLBACK_URL: http://rate-guard-local:9000
      RATE_GUARD_PRIMARY_PROBE_INTERVAL_S: "30"
      THIRTEENF_SMART_RETRY_ENABLED: "${THIRTEENF_SMART_RETRY_ENABLED:-false}"
      THIRTEENF_JOB_WORKER_ENABLED: "${THIRTEENF_JOB_WORKER_ENABLED:-true}"
    volumes:
      - ./backend:/code
      - ./docs:/code/docs
      - ./storage/edgar_raw:/code/storage/edgar_raw
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      rate-guard-local:
        # Do not make central availability depend on fallback health. If the
        # local process is still booting, API restart policy retries resolution.
        condition: service_started
    networks:
      - default
      - shared-infra

networks:
  shared-infra:
    external: true
    name: projects-shared

volumes:
  rate_guard_fallback_cache:
